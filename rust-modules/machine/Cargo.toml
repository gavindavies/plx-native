[package]
name = "plx_machine"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PiTV machine layer: the machine/effect contract, the present gate, the idle wake and the motion springs."
publish = false

[lib]
name = "plx_machine"
crate-type = ["rlib"]

[features]
default = []
devtriggers = ["plx_base/devtriggers"]
test-support = ["plx_base/test-support"]

[dependencies]
plx_base = { path = "../base" }

[dev-dependencies]
plx_base = { path = "../base", features = ["test-support"] }

[lints]
workspace = true
