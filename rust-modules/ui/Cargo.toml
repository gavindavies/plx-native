[package]
name = "plx_ui"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PiTV ui layer: the UI library (theme, widgets, cards, tables and forms, focus, containers, the dispatcher)."
publish = false
build = "build.rs"

[lib]
name = "plx_ui"
crate-type = ["rlib"]

[features]
default = []
devtriggers = ["plx_base/devtriggers", "plx_machine/devtriggers", "plx_platform/devtriggers", "plx_gfx/devtriggers"]
threadcheck = ["plx_base/threadcheck"]
test-support = ["plx_base/test-support", "plx_machine/test-support", "plx_platform/test-support", "plx_gfx/test-support"]

[dependencies]
plx_base = { path = "../base" }
plx_machine = { path = "../machine" }
plx_platform = { path = "../platform" }
plx_gfx = { path = "../gfx" }

[dev-dependencies]
plx_base = { path = "../base", features = ["test-support"] }
plx_machine = { path = "../machine", features = ["test-support"] }
plx_platform = { path = "../platform", features = ["test-support"] }
plx_gfx = { path = "../gfx", features = ["test-support"] }

[lints]
workspace = true
