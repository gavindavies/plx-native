[package]
name = "plx_appkit"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PiTV appkit layer: widgets several screens share (player HUD, track menus, info card)."
publish = false
build = "build.rs"

[lib]
name = "plx_appkit"
crate-type = ["rlib"]

[features]
default = []
devtriggers = ["plx_base/devtriggers", "plx_machine/devtriggers", "plx_platform/devtriggers", "plx_gfx/devtriggers", "plx_ui/devtriggers", "plx_data/devtriggers", "plx_media/devtriggers"]
test-support = ["plx_base/test-support", "plx_machine/test-support", "plx_platform/test-support", "plx_gfx/test-support", "plx_ui/test-support", "plx_data/test-support", "plx_media/test-support"]

[dependencies]
plx_base = { path = "../base" }
plx_machine = { path = "../machine" }
plx_platform = { path = "../platform" }
plx_gfx = { path = "../gfx" }
plx_ui = { path = "../ui" }
plx_data = { path = "../data" }
plx_media = { path = "../media" }

[dev-dependencies]
plx_appkit = { path = ".", features = ["devtriggers"] }
plx_base = { path = "../base", features = ["test-support"] }
plx_machine = { path = "../machine", features = ["test-support"] }
plx_platform = { path = "../platform", features = ["test-support"] }
plx_gfx = { path = "../gfx", features = ["test-support"] }
plx_ui = { path = "../ui", features = ["test-support"] }
plx_data = { path = "../data", features = ["test-support"] }
plx_media = { path = "../media", features = ["test-support"] }

[lints]
workspace = true
