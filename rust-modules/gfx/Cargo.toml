[package]
name = "plx_gfx"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PiTV gfx layer: the GLES2 renderer, text, images and the vector-icon rasterizer."
publish = false
build = "build.rs"

[lib]
name = "plx_gfx"
crate-type = ["rlib"]

[features]
default = []
devtools = []
devtriggers = ["plx_base/devtriggers", "plx_machine/devtriggers"]
test-support = ["plx_base/test-support", "plx_machine/test-support"]

[dependencies]
plx_base = { path = "../base" }
plx_machine = { path = "../machine" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
plx_base = { path = "../base", features = ["test-support"] }
plx_machine = { path = "../machine", features = ["test-support"] }

[lints]
workspace = true
