[package]
name = "plx_platform"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PiTV platform layer: the localization catalog and the artwork cache."
publish = false
build = "build.rs"

[lib]
name = "plx_platform"
crate-type = ["rlib"]

[features]
default = []
devtriggers = ["plx_base/devtriggers"]
test-support = ["plx_base/test-support"]

[dependencies]
plx_base = { path = "../base" }
icu_locale = "=2.1.1"
icu_decimal = "=2.1.1"
icu_datetime = { version = "=2.1.1", default-features = false, features = ["compiled_data"] }
icu_calendar = "=2.1.1"
icu_provider = { version = "2.1", features = ["sync"] }

[build-dependencies]
serde_json = "1"
serde = "1"

[dev-dependencies]
plx_base = { path = "../base", features = ["test-support"] }
serde_json = "1"
serde = "1"

[lints]
workspace = true
