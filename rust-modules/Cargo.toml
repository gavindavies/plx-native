# The PiTV workspace. This package (the application: the event loop, the headless harness and the
# `pitv` binary) is its ROOT; the members are the layer crates it is built from, lowest first.
[workspace]
members = [
    "base",
    "machine",
    "platform",
    "gfx",
    "ui",
    "data",
    "media",
    "appkit",
    "screens",
]
resolver = "2"

[package]
name = "plxnative-modules"
# The version the app reports: build.rs publishes `PLX_VERSION`, which is this number exactly for a
# release build (`PLX_RELEASE=1`) and the next minor plus `-dev` for every other build.
version = "0.8.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PiTV — a 4K video player for a laptop under the TV: local folders and mounted SMB shares."

[lib]
name = "plxnative_modules"
crate-type = ["rlib"]

[[bin]]
name = "pitv"
path = "src/bin/pitv.rs"

[features]
# All three are on for development and dropped by `--no-default-features`, which is what a
# shipping build uses.
default = ["devtools", "devtriggers", "threadcheck"]
# Developer chrome that must be DRAW-ONLY: the on-screen frame counter.
devtools = ["plx_gfx/devtools"]
# The headless harness and dev surface: the remote FIFO (`pitv-remote`), on-demand screenshots and
# the `pitv-*` trigger files in the runtime directory (src/dev.rs).
devtriggers = [
    "plx_base/devtriggers",
    "plx_machine/devtriggers",
    "plx_platform/devtriggers",
    "plx_gfx/devtriggers",
    "plx_ui/devtriggers",
    "plx_data/devtriggers",
    "plx_media/devtriggers",
    "plx_appkit/devtriggers",
    "plx_screens/devtriggers",
]
# Make main-thread violations LOUDER (abort/warning); never changes a code path that succeeds.
threadcheck = ["plx_base/threadcheck", "plx_ui/threadcheck"]

# Warnings are ERRORS in every workspace package, in every cargo invocation. In the manifest rather
# than in RUSTFLAGS so it binds this workspace's code and not its dependencies. While mid-edit,
# `RUSTFLAGS="--cap-lints=warn"` turns them back into warnings. A warning that is genuinely wrong
# for one site gets a NARROW `#[allow]` carrying the reason.
[workspace.lints.rust]
warnings = "deny"

[lints]
workspace = true

[dependencies]
plx_base = { path = "base" }
plx_machine = { path = "machine" }
plx_platform = { path = "platform" }
plx_gfx = { path = "gfx" }
plx_ui = { path = "ui" }
plx_data = { path = "data" }
plx_media = { path = "media" }
plx_appkit = { path = "appkit" }
plx_screens = { path = "screens" }
# PNG encoding for screenshots (src/shot.rs) and artwork decoding.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"

# `lto = "fat"` and one codegen unit give back the cross-crate inlining and dead-code removal the
# split into layer crates would otherwise cost the per-frame code.
[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1

# Each layer's `cfg(test)` seams, which a dependency is never built with: the tests here ask for
# them by feature.
[dev-dependencies]
plx_base = { path = "base", features = ["test-support"] }
plx_machine = { path = "machine", features = ["test-support"] }
plx_platform = { path = "platform", features = ["test-support"] }
plx_gfx = { path = "gfx", features = ["test-support"] }
plx_ui = { path = "ui", features = ["test-support"] }
plx_data = { path = "data", features = ["test-support"] }
plx_media = { path = "media", features = ["test-support"] }
plx_appkit = { path = "appkit", features = ["test-support"] }
plx_screens = { path = "screens", features = ["test-support"] }
