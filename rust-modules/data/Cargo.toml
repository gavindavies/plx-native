[package]
name = "plx_data"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PiTV data layer: the local library, title metadata, watch progress and player settings."
publish = false

[lib]
name = "plx_data"
crate-type = ["rlib"]

[features]
default = []
devtriggers = ["plx_base/devtriggers", "plx_machine/devtriggers", "plx_platform/devtriggers"]
test-support = ["plx_base/test-support", "plx_machine/test-support", "plx_platform/test-support"]

[dependencies]
plx_base = { path = "../base" }
plx_machine = { path = "../machine" }
plx_platform = { path = "../platform" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }

[dev-dependencies]
plx_base = { path = "../base", features = ["test-support"] }
plx_machine = { path = "../machine", features = ["test-support"] }
plx_platform = { path = "../platform", features = ["test-support"] }
plx_data = { path = ".", features = ["devtriggers"] }

[lints]
workspace = true
