[package]
name = "plx_data"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PlxNative data layer: the content stores and the catalog, browse, detail, person, collection, search and view-state modules they own."
repository = "https://github.com/GLinnik21/plx-native"
publish = false

[lib]
name = "plx_data"
# An rlib the application crate links, never an archive of its own: the one staticlib is the
# application crate's (ci/test_no_host_staticlib.py holds that line for this crate too). It owns no
# build script, declares no `extern "C"` and links nothing.
crate-type = ["rlib"]

[features]
default = []
# Forwarded from the application crate, which is the only one that sets them.
devtriggers = ["plx_base/devtriggers", "plx_machine/devtriggers", "plx_platform/devtriggers"]
# The `cfg(test)` seams other crates' tests use (`PlayingItem::with_subs`, ...). Enabled from the
# dependents' `[dev-dependencies]`; never in a shipped build.
test-support = ["plx_base/test-support", "plx_machine/test-support", "plx_platform/test-support"]

[dependencies]
plx_base = { path = "../base" }
plx_machine = { path = "../machine" }
plx_platform = { path = "../platform" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }

[dev-dependencies]
plx_base = { path = "../base", features = ["test-support"] }
plx_machine = { path = "../machine", features = ["test-support"] }
plx_platform = { path = "../platform", features = ["test-support"] }
# The crate dev-depends on ITSELF with `devtriggers`, so `cargo test -p plx_data` alone builds the
# crate and every layer below it exactly as the application's default features do.
plx_data = { path = ".", features = ["devtriggers"] }

[lints]
workspace = true
